name: Bug report
description: Report a reproducible problem in StitchCraft
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets and customer data from logs before submitting.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Backend API
        - Web dashboard
        - Mobile app
        - Deployment or CI
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
