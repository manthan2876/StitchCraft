version: 2
updates:
  - package-ecosystem: npm
    directory: /stitchcraft-backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /stitchcraft-frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: /stitchcraft-mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
