name: CI

on:
  push:
    branches: [main]
    paths:
      - 'stitchcraft-backend/**'
      - 'stitchcraft-frontend/**'
      - 'stitchcraft-mobile/**'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stitchcraft-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure backend environment placeholder
        run: cp .env.example .env
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          find . -name node_modules -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stitchcraft-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stitchcraft-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile analysis and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stitchcraft-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Firebase placeholder
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart
      - name: Configure mobile environment placeholder
        run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
