services:
  - type: web
    name: stitchcraft-backend
    runtime: node
    rootDir: stitchcraft-backend
    buildFilter:
      paths:
        - stitchcraft-backend/**
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: UPLOAD_BUCKETS
        value: profile-images,maap-images
